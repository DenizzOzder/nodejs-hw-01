openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  description: |
    Kişi yönetimi için örnek API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:3000
    description: Lokal
  - url: https://nodejs-hw-01-1-xds7.onrender.com
    description: Üretim

tags:
  - name: Contacts
    description: Kişilerle ilgili uç noktalar

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Contact:
      type: object
      properties:
        _id:
          type: string
          description: Mongo ObjectId
          example: 66f12d4bb6c7d2f9c2a4a111
        name:
          type: string
          example: Alice Smith
        email:
          type: string
          format: email
          example: alice@example.com
        phoneNumber:
          type: string
          example: '+90 555 123 45 67'
        isFavourite:
          type: boolean
          example: false
        contactType:
          type: string
          enum: [personal, business]
          example: personal
        photoUrl:
          type: string
          nullable: true
      required: [name, email, phoneNumber]

    CreateContactDto:
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          required: [name, email, phoneNumber]

    UpdateContactDto:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: string }
        isFavourite: { type: boolean }
        contactType: { type: string, enum: [personal, business] }
      additionalProperties: false

    ErrorResponse:
      type: object
      properties:
        status: { type: integer, example: 404 }
        message: { type: string, example: Not found }

security:
  - bearerAuth: []

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/index.get.yaml
    post:
      $ref: ../swagger/paths/contacts/index.post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
