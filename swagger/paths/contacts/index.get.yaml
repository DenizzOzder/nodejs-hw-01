tags:
  - Contacts
summary: Kişi listesini getir
operationId: listContacts
description: Kişi listesini sayfalı ve filtreli döndürür.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Sayfa numarası
  - name: limit
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    description: Sayfa başına kayıt
  - name: sortBy
    in: query
    schema:
      type: string
      enum: [name, email, createdAt]
    description: Sıralama alanı
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sıralama yönü
  - name: isFavourite
    in: query
    schema:
      type: boolean
    description: Favori filtresi
  - name: contactType
    in: query
    schema:
      type: string
      enum: [personal, business]
    description: Tür filtresi
responses:
  '200':
    description: Başarılı
    content:
      application/json:
        schema:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            data:
              type: array
              items:
                $ref: ../../../docs/openapi.yaml#/components/schemas/Contact
